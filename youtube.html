<!DOCTYPE html>
<html>
    <head>
        <title>Youtube.com Clone</title>
        <style>
            .thumbnail{
                width: 300px;
                border-radius:12px;
                display:block;
                margin-bottom:8px;
                margin-top:20px;
            }
            .search-bar{
                display:block;
                font-size:20px;
                margin-left:12px;
                border-radius:5px;
                border-width:1px;
                box-shadow:none;
                outline:none;
                border-color:rgb(96,96,96);
                border-radius:20px;
                padding-top:5px;
                padding-bottom:5px;
                padding-left:10px;
            }
            .video-title{
                width:300px;
                margin-top:0px;
                margin-bottom:5px;
                margin-right:0px;
                margin-left:px;
                display:inline-block;
                font-weight:bold;
                font-style:Arial;
            }
            .video-author,
            .video-stats{
                color:rgb(96,96,96);
                font-size:13.5px;
                margin-top:0px;
                margin-bottom:0px;
                margin-left:0px;
            }
            .video-preview{
                width:300px;
                display:inline-block;
                vertical-align:top;
                margin-right:10px;
            }
            
        </style>
    </head>
    <body>
        <input class="search-bar" type="text" placeholder="Search">
        
        <div class="video-preview">
            <img class="thumbnail" src="thumbnails/hq720.avif">
            <p class="video-title">This Weird Habit Will make you Unbreakably Disciplined</p>
            <p class="video-author">Not More Self-Improvement</p>
            <p class="video-stats">90K views &#183 5 days ago</p>
        </div>
        <div class="video-preview">
            <img class="thumbnail" src="thumbnails/htmlcss.avif">
            <p class="video-title">HTML & CSS Full Course - Beginner to Pro</p>

            <p class="video-author">SuperSimpleDev</p>
            <p class="video-stats">1.9 crore views &#183 4 years ago</p>
        </div>
    </body>
</html>

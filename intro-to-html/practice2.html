<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <style>
            .profile{
                width:140px;
                box-shadow: 1px 1px 10px black;
                height:240px;
                display:inline-block;
                vertical-align:top;
                margin-left:10px;
            }
            .cat{
                width:140px;
                height:140px;
                display:block;
                object-fit:cover;
            }
            .class{
                width:140px;
            }
            .name{
                margin-top:5px;
                margin-bottom:0px;
                margin-left:5px;
                font-size:19px;
                font-weight:bold;

                
            }
            .close{
                margin-top:0px;
                margin-bottom:0px; 
                margin-left:5px;
                font-size:15px;
                color:rgb(96,96,96);
                
            }
            .add{
                background-color: rgb(78, 78, 193);
                color:white;
                margin-left:5px;
                padding-left:10px;
                padding-top:5px;
                padding-bottom:5px;
                border-radius:3px;
                width:90px;
            }
        </style>
        <div class="profile">
            <img class="cat" src="cat.jpg">
            <p class="name">Pole</p>
            <p class="close">2 mutual friends</p>
            <p class="add">Add Friend</p>
        </div>
        <div class="profile">
            <img class="cat" src="cat2.jpg">
            <p class="name">ciggs</p>
            <p class="close">5 mutual friends</p>
            <p class="add">Add Friend</p>
        </div>
        <div class="profile">
            <img class="cat" src="johan.jpg">
            <p class="name">Johan</p>
            <p class="close">0 mutual friends</p>
            <p class="add">Add Friend</p>
        </div>
    </body>
</html>
